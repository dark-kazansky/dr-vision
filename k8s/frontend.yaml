apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: drvision-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drvision-frontend
  template:
    metadata:
      labels:
        app: drvision-frontend
    spec:
      containers:
        - name: frontend
          # Replace with your actual registry image, e.g., myregistry.com/drvision-frontend:latest
          image: drvision-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: drvision-frontend
spec:
  type: LoadBalancer # Exposes the frontend to the outside world
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: drvision-frontend

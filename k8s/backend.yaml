apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: drvision-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drvision-backend
  template:
    metadata:
      labels:
        app: drvision-backend
    spec:
      containers:
        - name: backend
          # In a real environment, you'd replace this with your actual registry image, e.g., myregistry.com/drvision-backend:latest
          image: drvision-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://drvision:drvision_dev@postgres:5432/drvision"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: drvision-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: drvision-backend

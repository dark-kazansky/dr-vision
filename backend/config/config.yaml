# OCR Web UI Configuration File
# This file contains all configurable settings for the OCR Web UI application.
# Settings can be overridden using environment variables (see documentation).

# =============================================================================
# API Provider Configuration
# =============================================================================
# Define external API providers that host OCR models.
# Each provider has a base URL and timeout settings.

api_providers:
  lm_studio:
    # Base URL for LM Studio API server
    # Can be overridden with environment variable: LM_STUDIO_BASE_URL
    base_url: "http://localhost:1234"
    
    # Request timeout in seconds
    timeout: 30

# =============================================================================
# Model Configurations
# =============================================================================
# Define OCR models available for processing.
# Each model specifies its provider, display name, and inference parameters.

models:
  # LightOnOCR-2-1B: Lightweight OCR model optimized for speed
  lightonocr-2-1b:
    model_id: "lightonocr-2-1b"
    provider: "lm_studio"
    name: "LightOnOCR-2-1B"
    
    # Maximum number of tokens to generate
    max_tokens: 4096
    
    # Temperature controls randomness (0.0 = deterministic, 1.0 = creative)
    # Lower values recommended for OCR accuracy
    temperature: 0.2
    
    # Top-p sampling threshold (nucleus sampling)
    top_p: 0.9
  
  # DeepSeek OCR: Advanced OCR model with high accuracy
  deepseek-ocr:
    model_id: "deepseek-ocr"
    provider: "lm_studio"
    name: "DeepSeek OCR"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9
  
  # Nanonets OCR2-3B: Balanced OCR model for general use
  nanonets-ocr2-3b:
    model_id: "nanonets-ocr2-3b"
    provider: "lm_studio"
    name: "Nanonets OCR2-3B"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

# Default model to use when none is specified
# Can be overridden with environment variable: DEFAULT_MODEL_ID
default_model: "lightonocr-2-1b"

# =============================================================================
# FastAPI Server Configuration
# =============================================================================
# Settings for the FastAPI web server.

fastapi:
  # Enable debug mode for development (shows detailed error messages)
  # Set to false in production
  debug: true
  
  # Host address to bind the server to
  # "0.0.0.0" allows external connections, "127.0.0.1" for localhost only
  host: "0.0.0.0"
  
  # Port number for the server
  port: 8000
  
  # CORS (Cross-Origin Resource Sharing) allowed origins
  # List of URLs that can make requests to this API
  # Use ["*"] to allow all origins (not recommended for production)
  cors_origins:
    - "http://localhost:3000"  # Nuxt.js development server
    - "http://localhost:5001"  # Alternative frontend port

# =============================================================================
# File Upload Configuration
# =============================================================================
# Settings for file upload handling and validation.

upload:
  # Directory where uploaded files are temporarily stored
  # Can be overridden with environment variable: UPLOAD_FOLDER
  folder: "uploads"
  
  # Maximum file size in megabytes
  # Can be overridden with environment variable: MAX_FILE_SIZE_MB
  max_size_mb: 10
  
  # Allowed file extensions for upload
  # Only files with these extensions will be accepted
  allowed_extensions:
    - png
    - jpg
    - jpeg
    - pdf

# =============================================================================
# PDF Processing Configuration
# =============================================================================
# Settings specific to PDF file processing.

pdf:
  # DPI (dots per inch) for rendering PDF pages to images
  # Higher values produce better quality but slower processing
  # Recommended: 150-300 for most documents
  render_dpi: 200
  
  # Whether to process all pages by default when not specified
  # If false, only the first page is processed unless explicitly requested
  default_process_all_pages: false

# Dr.Vision Configuration File
# This file contains all configurable settings for the Dr.Vision OCR application.
# Settings can be overridden using environment variables (see documentation).

# =============================================================================
# API Provider Configuration
# =============================================================================
# Define external API providers that host models.
# Each provider has a base URL and timeout settings.

api_providers:
  google_studio:
    # Google Studio API (Gemini API)
    # Uses GOOGLE_STUDIO_API_KEY environment variable
    base_url: "https://generativelanguage.googleapis.com"
    timeout: 60

  poe_api:
    # POE API for LLM-based processing
    # Uses POE_API_KEY environment variable
    base_url: "https://api.poe.com/v1"
    timeout: 120

  lm_studio:
    # LM Studio API server for local models
    # Can be overridden with environment variable: LM_STUDIO_BASE_URL
    base_url: "http://localhost:1234"
    timeout: 30

  bedrock:
    # AWS Bedrock Runtime (uses boto3, no base_url needed)
    # Uses BEDROCK_REGION env var (default: ap-southeast-2)
    # AWS credentials from environment or IAM role
    base_url: "https://bedrock-runtime.ap-southeast-2.amazonaws.com"
    timeout: 120

# =============================================================================
# Model Configurations
# =============================================================================
# Define models available for processing.
# Each model specifies its provider, display name, and inference parameters.

models:
  # ---------------------------------------------------------------------------
  # Google Studio Models (Gemini API)
  # ---------------------------------------------------------------------------
  # Primary provider for OCR (VLM), Classification (LLM), Schema Generation

  gemini-2.5-flash-lite:
    model_id: "gemini-2.5-flash-lite"
    provider: "google_studio"
    name: "Gemini 2.5 Flash Lite"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-2.5-flash:
    model_id: "gemini-2.5-flash"
    provider: "google_studio"
    name: "Gemini 2.5 Flash"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-2.5-flash-image:
    model_id: "gemini-2.5-flash-image"
    provider: "google_studio"
    name: "Gemini 2.5 Flash Image"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-3-pro-preview:
    model_id: "gemini-3-pro-preview"
    provider: "google_studio"
    name: "Gemini 3 Pro Preview"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-3-pro-image-preview:
    model_id: "gemini-3-pro-image-preview"
    provider: "google_studio"
    name: "Gemini 3 Pro Image Preview"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  # ---------------------------------------------------------------------------
  # POE API Models
  # ---------------------------------------------------------------------------
  # Secondary provider for Extraction, Splitting, and fallback operations

  assistant:
    model_id: "assistant"
    provider: "poe_api"
    name: "POE Assistant"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-3-flash:
    model_id: "gemini-3-flash"
    provider: "poe_api"
    name: "Gemini 3 Flash (POE)"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  gemini-3-pro:
    model_id: "gemini-3-pro"
    provider: "poe_api"
    name: "Gemini 3 Pro (POE)"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  qwen3-max:
    model_id: "qwen3-max"
    provider: "poe_api"
    name: "Qwen3 Max"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  claude-opus-4.5:
    model_id: "claude-opus-4.5"
    provider: "poe_api"
    name: "Claude Opus 4.5"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  # ---------------------------------------------------------------------------
  # LM Studio Models (Local)
  # ---------------------------------------------------------------------------
  # Local provider for offline OCR processing

  deepseek-ocr:
    model_id: "deepseek-ocr"
    provider: "lm_studio"
    name: "DeepSeek OCR"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  lightonocr-2-1b:
    model_id: "lightonocr-2-1b"
    provider: "lm_studio"
    name: "LightOnOCR 2 1B"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  # ---------------------------------------------------------------------------
  # AWS Bedrock Models
  # ---------------------------------------------------------------------------
  # Uses AWS credentials from environment (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
  # Model IDs are inference profile ARNs from environment variables

  claude-haiku:
    model_id: "claude-haiku"
    provider: "bedrock"
    name: "Claude Haiku (Bedrock)"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

  claude-sonnet:
    model_id: "claude-sonnet"
    provider: "bedrock"
    name: "Claude Sonnet (Bedrock)"
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.9

# Default model to use when none is specified
default_model: "gemini-2.5-flash"

# =============================================================================
# FastAPI Server Configuration
# =============================================================================
# Settings for the FastAPI web server.

fastapi:
  # Debug mode is disabled by default for production safety.
  # To enable for development, set environment variable: FASTAPI_DEBUG=true
  debug: false

  # Host address to bind the server to
  # "0.0.0.0" allows external connections, "127.0.0.1" for localhost only
  host: "0.0.0.0"

  # Port number for the server
  port: 8882

  # CORS (Cross-Origin Resource Sharing) allowed origins
  # List of URLs that can make requests to this API
  cors_origins:
    - "http://localhost:3000" # Nuxt.js development server
    - "http://localhost:5001" # Alternative frontend port
    - "http://aimsb.theworkpc.com:3000" # Production frontend
    - "http://aimsb.theworkpc.com" # Production frontend (port 80)

# =============================================================================
# File Upload Configuration
# =============================================================================
# Settings for file upload handling and validation.

upload:
  # Directory where uploaded files are temporarily stored
  folder: "uploads"

  # Maximum file size in megabytes
  max_size_mb: 10

  # Allowed file extensions for upload
  allowed_extensions:
    - png
    - jpg
    - jpeg
    - pdf

# =============================================================================
# PDF Processing Configuration
# =============================================================================
# Settings specific to PDF file processing.

pdf:
  # DPI (dots per inch) for rendering PDF pages to images
  # Higher values produce better quality but slower processing
  # Recommended: 150-300 for most documents
  render_dpi: 200

  # Whether to process all pages by default when not specified
  default_process_all_pages: false

# =============================================================================
# Document Splitting Configuration
# =============================================================================
# Settings for document splitting feature.

split:
  # Model for splitting (uses POE API)
  model: "claude-opus-4.5"

  # Maximum number of categories allowed
  max_categories: 50

  # Request timeout in seconds
  timeout: 120

  # Number of retry attempts for network errors
  retry_attempts: 3

# =============================================================================
# Rate Limiting Configuration
# =============================================================================
# Settings for per-client rate limiting on processing endpoints.

rate_limit:
  # Enable or disable rate limiting
  enabled: true

  # Sustained request rate per client IP (tokens refill at this rate)
  requests_per_minute: 30

  # Maximum burst capacity (bucket size) — allows short bursts above the
  # sustained rate before throttling kicks in
  burst_size: 10

# =============================================================================
# Background Tasks Configuration
# =============================================================================
# Settings for background processing of heavy documents (e.g. multi-page PDFs).

background_tasks:
  # Enable or disable background task processing
  enabled: true

  # Documents with more pages than this threshold are processed in the background;
  # the client receives a job ID immediately and can poll for status/result.
  threshold_pages: 5

  # How long (in seconds) to keep completed/failed job results before cleanup
  job_ttl_seconds: 3600

# =============================================================================
# Job Queue Configuration
# =============================================================================
# Settings for the async job queue that processes workflow executions.

job_queue:
  # Maximum number of jobs that can run concurrently.
  # Higher values = more throughput but more resource usage (CPU, RAM, API calls).
  # Recommended: 2-4 for single server, scale with available AI API rate limits.
  max_concurrent: 2

  # Default timeout per job in seconds. Jobs exceeding this are marked as failed.
  default_timeout: 300

  # Default max retries per failed node within a job.
  default_max_retries: 3

  # Base delay (seconds) for exponential backoff between retries.
  retry_delay_base: 1.0

# =============================================================================
# Tier Configuration Reference
# =============================================================================
# This is a reference summary. Actual tier mappings are in tier_config.py

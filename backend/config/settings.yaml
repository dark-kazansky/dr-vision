#
# Classifier LLM:
#   Rapid:   lightonocr-2-1b (LM Studio - Local)
#   Normal:  claude-haiku (AWS Bedrock)
#   Advance: claude-sonnet (AWS Bedrock)
#   Multimodal: claude-sonnet (AWS Bedrock - direct image input)
#
# Extractor:
#   Rapid:   lightonocr-2-1b (LM Studio - Local)
#   Normal:  claude-haiku (AWS Bedrock)
#   Advance: claude-sonnet (AWS Bedrock)
#
# Schema Generator:
#   All tiers: gemini-3-pro-preview (Google Studio)
#
# Splitter:
#   Rapid:   lightonocr-2-1b (LM Studio - Local)
#   Normal:  claude-haiku (AWS Bedrock)
#   Advance: claude-sonnet (AWS Bedrock)
